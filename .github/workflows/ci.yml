name: Nexari CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust/wasm toolchain for the Vivari SDK build
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target wasm32-unknown-unknown --target wasm32-wasip1
          echo "NEXARI_RUST_TOOLCHAIN=$(rustup toolchain list | grep -F '1.88.0' | head -1 | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Build the pinned Vivari SDK
        run: |
          npm ci --prefix runtime/vivari
          npm run build:vivari
      - run: npm ci
      - run: npm run typecheck
      - run: npm run generate:compatibility
      - run: git diff --exit-code -- compatibility
      - run: npm test
      - run: git diff --check

  browser-e2e:
    needs: contract-and-provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust/wasm toolchain for the Vivari SDK build
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target wasm32-unknown-unknown --target wasm32-wasip1
          cargo install wasm-pack --locked
          echo "NEXARI_RUST_TOOLCHAIN=$(rustup toolchain list | grep -F '1.88.0' | head -1 | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Build the pinned Vivari SDK
        run: |
          npm ci --prefix runtime/vivari
          npm run build:vivari
      - run: npm ci
      - name: Install browser lab dependencies
        run: npm ci --prefix labs/browser-smoke
      - name: Browser E2E (owned loopback-only Chrome, fresh ephemeral profile)
        run: npm run test:browser-lab
        env:
          NEXARI_CHROME_BIN: /usr/bin/google-chrome

  runtime-toolchain-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --version
      - run: git -C runtime/vivari rev-parse HEAD
      - run: test -f runtime/vivari/LICENSE
