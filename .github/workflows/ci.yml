name: Nexari CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@fe02b34f5f605dccca3d94a97e8b97fa44784eb7 # v4.0.0
        with:
          version: 9.14.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Restore Vivari v1.0.0 tag (provenance check resolves it; mirror carries no tags)
        run: |
          git -C runtime/vivari fetch --unshallow origin || true
          git -C runtime/vivari fetch --tags --force || true
          git -C runtime/vivari tag v1.0.0 2629c71097238400c45aefa213ef61df4794c2b7 2>/dev/null || git -C runtime/vivari tag -f v1.0.0 2629c71097238400c45aefa213ef61df4794c2b7
      - name: Install pinned Rust/wasm toolchain for the Vivari SDK build
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target wasm32-unknown-unknown --target wasm32-wasip1
          cargo install wasm-pack --locked
          echo "NEXARI_RUST_TOOLCHAIN=$(rustup toolchain list | grep -F '1.88.0' | head -1 | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Build the pinned Vivari SDK
        run: |
          npm ci --prefix runtime/vivari
          pnpm run build:vivari
      - name: Build Vivari vendor assets (npm + sqlite)
        run: |
          npm run --prefix runtime/vivari vendor:npm
          npm run --prefix runtime/vivari vendor:sqlite
          npm run --prefix runtime/vivari vendor:pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run generate:compatibility
      - run: git diff --exit-code -- compatibility
      - run: pnpm test
      - run: git diff --check

  browser-e2e:
    needs: contract-and-provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@fe02b34f5f605dccca3d94a97e8b97fa44784eb7 # v4.0.0
        with:
          version: 9.14.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Restore Vivari v1.0.0 tag (provenance check resolves it; mirror carries no tags)
        run: |
          git -C runtime/vivari fetch --unshallow origin || true
          git -C runtime/vivari fetch --tags --force || true
          git -C runtime/vivari tag v1.0.0 2629c71097238400c45aefa213ef61df4794c2b7 2>/dev/null || git -C runtime/vivari tag -f v1.0.0 2629c71097238400c45aefa213ef61df4794c2b7
      - name: Install pinned Rust/wasm toolchain for the Vivari SDK build
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target wasm32-unknown-unknown --target wasm32-wasip1
          cargo install wasm-pack --locked
          echo "NEXARI_RUST_TOOLCHAIN=$(rustup toolchain list | grep -F '1.88.0' | head -1 | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Build the pinned Vivari SDK
        run: |
          npm ci --prefix runtime/vivari
          pnpm run build:vivari
      - name: Build Vivari vendor assets (npm + sqlite)
        run: |
          npm run --prefix runtime/vivari vendor:npm
          npm run --prefix runtime/vivari vendor:sqlite
          npm run --prefix runtime/vivari vendor:pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser lab dependencies
        run: npm ci --prefix labs/browser-smoke
      - name: Rebuild Vivari SDK (lab vite build needs core/dist at build time)
        run: pnpm run build:vivari
      - name: Browser E2E (owned loopback-only Chrome, fresh ephemeral profile)
        run: pnpm run test:browser-lab
        env:
          NEXARI_CHROME_BIN: /usr/bin/google-chrome-stable
        env:
          NEXARI_CHROME_BIN: /usr/bin/google-chrome

  runtime-toolchain-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@fe02b34f5f605dccca3d94a97e8b97fa44784eb7 # v4.0.0
        with:
          version: 9.14.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --version
      - run: git -C runtime/vivari rev-parse HEAD
      - run: test -f runtime/vivari/LICENSE
