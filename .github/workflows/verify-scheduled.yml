name: Nexari Scheduled Verification

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust/wasm toolchain for the Vivari SDK build
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target wasm32-unknown-unknown --target wasm32-wasip1
          cargo install wasm-pack --locked
          echo "NEXARI_RUST_TOOLCHAIN=$(rustup toolchain list | grep -F '1.88.0' | head -1 | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Build the pinned Vivari SDK
        run: |
          npm ci --prefix runtime/vivari
          npm run build:vivari
      - run: npm ci
      - run: npm run typecheck
      - run: npm run generate:compatibility
      - run: git diff --exit-code -- compatibility
      - run: npm test
      - run: git diff --check
